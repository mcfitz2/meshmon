[project]
name = "meshmon"
version = "0.2.0"
description = "openHop Repeater plugin: polls MeshCore repeaters for status and telemetry and exports them as Prometheus metrics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "meshcore==2.3.14",
    "prometheus-client>=0.20",
]

[project.scripts]
meshmon = "meshmon.main:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshmon"]

[tool.hatch.build.targets.wheel.shared-data]
"plugin/openhop-plugin.json" = "share/openhop/plugins/meshmon/openhop-plugin.json"
"plugin/config.default.json" = "share/openhop/plugins/meshmon/config.default.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["meshcore.*"]
ignore_missing_imports = true
